server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # 容器健康检查端点
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # 哈希文件名资源：永久缓存
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SVG 显式 MIME（图例/符号资源），其余静态资源照常
  location ~* \.svg$ {
    default_type image/svg+xml;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA 回退（哈希路由实际只用 index.html，回退保底）
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 入口绝不入缓存（no-store）：资源文件名带 hash，index 必须每次拉新，
  # 否则发版后旧 index 引用已删除的旧 hash 资源 → 白屏
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
